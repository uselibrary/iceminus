name: Build & Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build binaries (Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: iceminus-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: iceminus-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: iceminus-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/iceminus.exe out/${{ matrix.artifact }} || true
          else
            cp target/${{ matrix.target }}/release/iceminus out/${{ matrix.artifact }} || true
            chmod +x out/${{ matrix.artifact }} || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v8
        with:
          name: iceminus-linux-amd64

      - name: Download mac artifact
        uses: actions/download-artifact@v8
        with:
          name: iceminus-darwin-arm64

      - name: Download windows artifact
        uses: actions/download-artifact@v8
        with:
          name: iceminus-windows-amd64.exe

      - name: Gather artifacts to root
        run: |
          cp iceminus-linux-amd64/* . || true
          cp iceminus-darwin-arm64/* . || true
          cp "iceminus-windows-amd64.exe"/* . || true
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            iceminus-darwin-arm64
            iceminus-linux-amd64
            iceminus-windows-amd64.exe
